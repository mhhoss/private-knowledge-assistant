[project]
name = "private-knowledge-assistant"
version = "0.1.0"
description = "Private Knowledge Assistant - RAG based Document Q&A"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "llama-index>=0.14.23",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-llms-openai>=0.7.10",
    "llama-index-vector-stores-chroma>=0.5.5",
    "pydantic-settings>=2.15.0",
    "pyright>=1.1.411",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
# EXE002: every file on this checkout's filesystem reports as executable regardless of
# its git-tracked mode (confirmed: `chmod -x` is a no-op here), so the rule can't
# distinguish a real problem from the mount artifact. Git records the correct 100644
# mode for all of these files.
ignore = ["EXE002"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI's dependency-injection pattern requires `Depends(...)`/`File(...)` as
# literal argument defaults — it inspects the defaults to build the dependency graph,
# so moving the calls into the function body would break injection, not just style.
"app/api/routes.py" = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
